services:
  wuolah-pdf-helper:
    build:
      context: .
      dockerfile: Dockerfile
    image: wuolah-pdf-helper:latest
    container_name: wuolah-pdf-helper
    ports:
      - "8000:8000"
    environment:
      - BROWSER_HEADLESS=true
      - MAX_PDF_SIZE_MB=100
      - JOB_TTL_MINUTES=30
      - TEMP_DIR=/tmp/wuolah-pdf
      - BROWSER_TIMEOUT_SECONDS=150
      - DOWNLOAD_TIMEOUT_SECONDS=120
    volumes:
      - ./data:/tmp/wuolah-pdf
    restart: unless-stopped
    ipc: host
